name: Build

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: macos-latest
            name: macos-universal
            cmake_extra: -DCMAKE_OSX_ARCHITECTURES=arm64;x86_64
          - os: ubuntu-latest
            name: linux-x64

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev \
            libcurl4-openssl-dev libgl1-mesa-dev libwebkit2gtk-4.1-dev libgtk-3-dev ninja-build

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_extra }}

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Run engine smoke test
        shell: bash
        run: |
          if [ -f build/OndaireEngineTest_artefacts/Release/OndaireEngineTest.exe ]; then
            build/OndaireEngineTest_artefacts/Release/OndaireEngineTest.exe
          else
            build/OndaireEngineTest_artefacts/Release/OndaireEngineTest
          fi

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: Ondaire-VST3-${{ matrix.name }}
          path: build/Ondaire_artefacts/Release/VST3/
          if-no-files-found: error

      - name: Upload Standalone
        uses: actions/upload-artifact@v4
        with:
          name: Ondaire-Standalone-${{ matrix.name }}
          path: build/Ondaire_artefacts/Release/Standalone/
          if-no-files-found: error
